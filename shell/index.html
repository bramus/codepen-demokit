<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>{{SITE_TITLE}}</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./scripts.js"></script>
</head>
<body>
  <header class="site-header">
    <h1>{{SITE_TITLE}}</h1>
    <p class="subtitle">{{SITE_SUBTITLE}}</p>
  </header>

  <main class="demo-directory" id="demo-directory">
    <p class="directory-status">Loading demos…</p>
    <noscript>
      <section class="empty-state">
        <h2>JavaScript required</h2>
        <p>Enable JavaScript to load the list of demos from <code>demos.json</code>.</p>
      </section>
    </noscript>
  </main>

  <footer class="site-footer">
    <p>{{SITE_FOOTER}}</p>
  </footer>

  <template id="demo-card-template">
    <li class="demo-card">
      <div class="demo-path">
        <code class="demo-path-text"></code>
      </div>
      <div class="demo-body">
        <p class="demo-description"></p>
        <ul class="demo-tags" aria-label="Tags"></ul>
      </div>
      <div class="demo-footer">
        <a class="demo-btn demo-btn-primary demo-open">
          <svg class="demo-btn-icon demo-open-icon" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true">
            <path d="M4.75 3.1a.75.75 0 0 1 1.13-.65l7.5 4.4a.75.75 0 0 1 0 1.3l-7.5 4.4a.75.75 0 0 1-1.13-.65V3.1Z" />
          </svg>
          <span>Open Demo</span>
        </a>
        <a class="demo-btn demo-btn-secondary demo-codepen" target="_blank" rel="noopener noreferrer">
          <svg class="demo-btn-icon demo-codepen-icon" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <polygon points="8,1.5 14.5,5.5 8,9.5 1.5,5.5" />
            <polygon points="8,6.5 14.5,10.5 8,14.5 1.5,10.5" />
            <line x1="1.5" y1="5.5" x2="1.5" y2="10.5" />
            <line x1="14.5" y1="5.5" x2="14.5" y2="10.5" />
            <line x1="8" y1="1.5" x2="8" y2="6.5" />
            <line x1="8" y1="9.5" x2="8" y2="14.5" />
          </svg>
          <span>Edit on CodePen</span>
        </a>
      </div>
    </li>
  </template>

  <template id="empty-state-template">
    <section class="empty-state">
      <h2>No demos yet</h2>
      <p>Create a self-contained demo folder inside <code>src/</code> (e.g., <code>src/my-demo/</code> or <code>src/my-group/my-demo/</code>) with a <code>.cdpn.json</code> or <code>index.html</code> file. Refresh this page and it will appear automatically.</p>
    </section>
  </template>
</body>
</html>
