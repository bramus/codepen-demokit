<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Web Platform Demos</title>
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./scripts.js"></script>
</head>
<body>
  <header class="site-header">
    <h1>Web Platform Demos</h1>
    <p class="subtitle">Self-contained, vanilla HTML, CSS, and JavaScript demos exploring modern web platform features.</p>
  </header>

  <main class="demo-directory" id="demo-directory">
    <p class="directory-status">Loading demos…</p>
    <noscript>
      <section class="empty-state">
        <h2>JavaScript required</h2>
        <p>Enable JavaScript and run <code>npm start</code> or <code>npm run dev</code> to populate the list of demos from <code>src/</code>.</p>
      </section>
    </noscript>
  </main>

  <footer class="site-footer">
    <p>Run <code>npm start</code> or <code>npm run dev</code> to serve <code>src/</code> locally. See <code>AGENTS.md</code> and <code>README.md</code> for conventions.</p>
  </footer>

  <template id="demo-card-template">
    <li class="demo-card">
      <p class="demo-description"></p>
      <div class="demo-meta">
        <code class="demo-path"></code>
        <a class="demo-codepen" target="_blank" rel="noopener noreferrer">CodePen</a>
      </div>
    </li>
  </template>

  <template id="empty-state-template">
    <section class="empty-state">
      <h2>No demos yet</h2>
      <p>Create a self-contained demo folder inside <code>src/</code> (e.g., <code>src/my-demo/</code> or <code>src/scroll-triggered-animations/my-demo/</code>) with an <code>index.html</code>, optional <code>styles.css</code>, and optional <code>scripts.js</code>. Refresh this page and it will appear automatically.</p>
    </section>
  </template>
</body>
</html>
